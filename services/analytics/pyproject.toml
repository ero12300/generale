[project]
name = "deal-desk-analytics"
version = "0.1.0"
description = "Motore analitico Deal Desk Immobiliare"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.0",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "httpx>=0.28.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
